# ---------------------------------------------------------------------------
# Substack Evening Topic Pool (Type B 獨立選題)
# ---------------------------------------------------------------------------
# 每日 18:00 substack_compose.py evening 會 round-robin 抽 1 個。
# 跑完一輪後游標重置（記在 .cursor 隱藏檔）。
#
# 加題目時格式：
#   - title: "..."（最終文章不一定用這個標題，這只是內部 slug）
#     seed: |
#       1-3 句的選題提示。讓 LLM 知道：
#       - 想挑戰的常識／敘事是什麼
#       - 想提供什麼樣的更高解析度模型
#       - 可選的 metaphor domain 提示
#     topic_category: <對應 topic_taxonomy.py 的 category_id>
#
# Hsin 持續補充。短期 v1 用以下 7 題輪播。
# ---------------------------------------------------------------------------

topics:
  - title: "為什麼最聰明的人最容易在『時間管理』上栽跟頭"
    seed: |
      常識：『規畫一切、精算分鐘』= 高 agency。
      想挑戰：超過某個閾值，「過度規畫」反而是焦慮的擬態，不是控制感。
      想引入：休止符 (rest) 的音樂理論視角——音符的意義來自空隙。
    topic_category: other

  - title: "高薪陷阱：為什麼把『加薪幅度』當人生 KPI 的人後期最容易卡住"
    seed: |
      常識：每年加薪 10–15% = 走在正軌。
      想挑戰：用 short-squeeze 視角看職涯——薪資 = 流動性受壓的價格，
      不一定反映你『真實的市場價值』。哪一天市場恢復流動，你才知道真價。
    topic_category: other

  - title: "為什麼『讀書筆記做得越漂亮、越記不住』"
    seed: |
      常識：精美筆記 = 認真學習。
      想挑戰：筆記的美觀程度跟記憶留存率是負相關（外化記憶反而讓大腦偷懶）。
      想引入：訊號處理的 feedback loop 觀點——筆記是 output，學習是 input，
      但弄混兩端就會卡住。
    topic_category: other

  - title: "AI 時代『一技之長』為什麼變成最危險的資產"
    seed: |
      常識：把一件事做到專精，這輩子就穩了。
      想挑戰：在 transformer scaling 時代，『單點專精』的折舊速度反而最快——
      因為這條線剛好是 AI 最容易複製的曲線。
      想引入：建築學的 load-bearing 視角，但要避免熱力學濫用。
    topic_category: ai_application

  - title: "為什麼『把興趣變工作』是最被高估的人生建議"
    seed: |
      常識：找到熱情、把它變成工作。
      想挑戰：當興趣加上 KPI，多巴胺系統會崩。電影剪輯的 tension/release 視角：
      興趣需要的是 release，工作不停 push tension，兩者邏輯互斥。
    topic_category: other

  - title: "投資的真正悖論：為什麼『理性的人』在牛市才會虧大錢"
    seed: |
      常識：感性的人投資會虧，理性的人能贏。
      想挑戰：熊市要的是紀律（理性人類強項），牛市要的是『停止思考』
      （理性人類弱項）。Contrarian Market 視角不必再用 short squeeze 老梗，
      可以挖到 narrative liquidity 這個層次。
    topic_category: us_stocks

  - title: "為什麼『同溫層』是一種廉價毒品、而『刻意不舒服』是一種長期套利"
    seed: |
      常識：同溫層是必要的歸屬感。
      想挑戰：把同溫層當作『情緒的高糖外賣』——便宜、快、上癮、長期代謝出問題。
      街頭生存的視角：街頭智者懂得在不同圈子間切換、保有資訊套利空間。
    topic_category: other
