# News Radar · Topic Keyword Fast-Path（Phase 8.20 Step 2）
# =========================================================
# 第一層 classifier：若標題或前 500 字命中任一關鍵字 → 直接歸類（省 LLM call）。
#
# 規則：
#   - 一篇文章可能命中多類，以 order（越上面優先）決定歸類。
#     → 所以把『最具體的類別』放最上面（ai_model > supply_chain > tech_product_launch）。
#   - 關鍵字匹配是大小寫不敏感、且會去除空白後比對。
#   - 詞句間用純字串 contains 比對；不是 regex（避免 escape 地獄）。
#   - 命中 keyword path 時，classifier 回 confidence=0.6（保守值），讓 LLM 在
#     模棱兩可時還是有機會被叫一次（例如 run_pipeline 看到 <0.7 時再打 LLM）。
#
# 調整規則：
#   - 新增/刪除 category 時，同步更新 src/topic_taxonomy.py 與 schema.sql seed。
#   - 關鍵字寧嚴不寬——寬了會把下一篇誤導到錯誤類別，進而污染 back-prop。
#
# 最後更新：2026-04-21 Cowork Claude overnight

