# 2026-04-19 清理 #2 (Phase 8.10 Kill-the-X)：
#   決策：放棄「RSSHub 公開實例抓 X/Twitter」路線 — rsshub.app 把 Twitter 路由整組 404。
#   一併撤掉其他結構性失能的 feed：
#     * OpenAI Blog：feed 活著但 30 篇文章全 HTTP 403（Cloudflare 站層擋）
#     * Bloomberg Technology：全 HTTP 403
#     * WSJ Tech：全 HTTP 401（paywall）
#     * FRED Economic News：DNS/網路層死透（DEAD_FEED）
#   補上 Wall Street 訊號：Howard Marks / Peter Zeihan「不靠 X」的官方管道。
#   Ray Dalio / Bill Ackman 只在 LinkedIn 發文、目前無穩定 RSS，暫略。
#
# 2026-04-19 擴充 #3 (Phase 8.15 Crypto Industry Expansion)：
#   策略位移：從「純科技 / 商業」頻道延伸到「科技 / 商業 / 加密貨幣產業」。
#   編輯方針：只收 **產業事件 / 協議升級 / 監管 / 機構動向**，
#            不收 alpha / 價格預測 / 年化收益攻略 / 買賣信號。
#   第一批新增 7 個源：4 家新聞型（CoinDesk / The Block / Decrypt / Cointelegraph）
#                    + 2 家機構研究（a16z crypto / Paradigm）+ 1 家社群長文（Bankless）
#   同步解鎖 must_exclude_any 的 `crypto` 與 `web3`（NFT 保留，alpha/meme 氣味過重）。
#   同步加裝 alpha-filter 排除詞（price prediction / yield farming / shitcoin 等）。
#   同步擴充 must_include_any 的產業關鍵字（Bitcoin / Ethereum / stablecoin / Coinbase
#   / MiCA / spot ETF / Chainalysis / CFTC …）。沒加這批關鍵字，新源會全數卡在
#   "no_keyword_match" — 等於白加源。
#   子字串匹配陷阱要避開：ETF → Netflix、SEC → second、airdrop → Apple AirDrop、
#   DeFi → define、Circle → virtuous circle。白名單一律用多字片語或長獨特詞。
#
# source_type（Phase 8.8 新增）：告訴下游 cleaner 該套什麼字數門檻。
#   article  — 傳統長文部落格 / 媒體稿（預設）
#   social   — Reddit、X/Twitter、Threads 等 UGC，預填 RSS summary、字數門檻最低
