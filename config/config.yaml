  # === Phase 8.24 · 國際官方來源 Tier 1 (2026-04-26) ===
  # 來源：spec/feeds_international_official_sources.md (boss-driven scope expansion)
  # 13 條 Tier 1 候選 → 6 條 ship-ready：Fed×2 / ECB press / EU Commission / WHO / BoJ。
  # 失敗 7 條（Whitehouse / Treasury / ECB monetary / IMF / WB / OECD / BIS）因
  # .gov/.org IA 改版、403 anti-bot、XML 自身 well-formed bug 等問題，不在這次 ship 範圍。
  # RSSHub self-host 路徑作為 sub-project 另議。
  #
  # 4-week grace period（feed_added_at + 28d）由 harvest_analyzer 在 Phase 9 上線時 enforce；
  # 在那之前任何 yield-based sunset 提案都 manually gated。所有 boss-driven 加入的 feed
  # 都帶 boss_lineage 欄位記錄 spec 來源 + 授權人 + 日期。
  #
  # 新欄位（fetcher.py 對未知 key silent ignore，無 schema migration 需要）：
  #   source_tier=official  → 機構類別（vs primary/secondary 的編輯權重 tier）
