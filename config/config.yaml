# ---------- 3. 過濾閾值 (Filter Thresholds) ----------
# min_word_count 分級（Phase 8.9）：
#   不同 source_type 的「有效訊號」密度本質不同，用單一門檻會誤殺 YouTube / Reddit。
#   cleaner 會依 item.source_type 取對應門檻；找不到 key 時 fallback 到 `default`。
#   (向後相容：若這個欄位仍為 int，cleaner 會當作所有 source_type 的 default)
filters:
  min_word_count:
    default: 100              # 兜底值
    article: 200              # 傳統 blog / 媒體稿：要求較高
    social:   40              # Reddit / 社群：RSS summary 常在 60-200 字
    video:    30              # YouTube description：極短也接受
    forum:    60              # HN / Lobsters：介於兩者之間
    rss_summary: 60           # Phase 8.15b：RSS 活但文章頁被擋的源（如 The Block）
  max_age_hours: 168          # 放寬至 7 天，確保今日素材充足
  duplicate_similarity: 0.85


# ---------- 4. 審核與信心分 (Review & Confidence) ----------
review:
  auto_publish_threshold: 0.85   # ≥ 此分數自動發布（初期建議暫時設 1.01 即全部手動）
  manual_review_threshold: 0.65  # < 此分數直接 Drop，不浪費你的眼睛
  initial_mode: manual_only      # manual_only / hybrid / auto_high_confidence

  # 信心分權重（加總必須 = 1.0）
  score_weights:
    has_specific_numbers: 0.25
    official_source: 0.30
    structure_complete: 0.25
    novelty_vs_recent: 0.20


# ---------- 5. 發文排程 (Publishing Schedule) ----------
# Phase 8.18 雲本混合架構（2026-04-20）：
#   Mac compose 端每小時入 queue 1-2 筆；Cloud publisher 端每小時整點 freshness-first 挑最新。
#   舊的 publishing_slots / max_posts_per_day / jitter / min_interval_minutes:90 已棄用，
#   保留在下方作為歷史紀錄，**不再被任何程式讀取**。
#   現行參數改由 run_publish_queue.py (Cloud) 與 run_pipeline.py --compose-only (Mac) 直接硬編。
schedule:
  timezone: Asia/Taipei
  # === Phase 8.18 有效參數 ===
  min_interval_minutes: 60       # 頻率上限：相鄰兩篇至少 1 小時
  max_interval_minutes: 120      # 頻率下限：相鄰兩篇至多 2 小時（超過走 fallback/stale path）
  buffer_size: 2                 # Mac compose queue buffer 目標筆數（1-2 小時 buffer）

  # === 以下欄位 DEPRECATED（Phase 8.18 起不再使用，保留僅為歷史）===
  publishing_slots:              # deprecated Phase 8.18
    - "08:30"
    - "12:30"
    - "21:00"
  jitter_minutes: 15             # deprecated Phase 8.18
  max_posts_per_day: 3           # deprecated Phase 8.18（Cloud freshness-first 沒有「天」概念）


# ---------- 6. 平台設定 (Platform Config) ----------
platforms:
  facebook:
    enabled: true
    attach_link: true
    attach_og_image: true

  threads:
    enabled: true
    attach_link: true           # Threads 支援 link preview
    max_chars: 500


# ---------- 7. LLM 設定 ----------
# ⚠️ Phase 8.19（2026-04-20）：以下 `primary` / `premium` block **已不被任何程式讀取**。
#   - scorer.py / composer.py / reflector.py 都硬編 "gemini-flash-latest"，再由
#     src/llm_brain.py 的 Gemini → Claude CLI 雙路徑兜底。
#   - 要改模型直接改 llm_brain.py 的 `DEFAULT_GEMINI_MODEL` / 各 caller 的 gemini_model 參數。
#   - 本區塊暫留作「這裡以前有設定什麼」的歷史紀錄；之後 Phase 8.20 若真要 config-driven
#     模型切換再重構這個 block 接入 llm_brain。
# daily_token_budget / weekly_token_budget 也沒被程式讀——真正的 budget 是免費額度，
#   不是軟性警戒線；保留作為未來做 monitoring 時的目標閾值。
llm:
  # === 以下 DEPRECATED（Phase 8.19 起不再被讀取）===
  primary:
    provider: gemini
    model: gemini-2.0-flash
    max_output_tokens: 2048

  premium:
    provider: anthropic
    model: claude-sonnet-4-6
    max_output_tokens: 4096

  # Token 預算警戒（目前無程式實作；未來接入 monitoring 時可作目標閾值）
  daily_token_budget: 20000
  weekly_token_budget: 100000


