# News Radar · Substack PODCAST inspiration sources (daily 12:00 batch, token-free)
# ===========================================================================
# Long-form interview podcasts on YouTube. The noon batch harvests these into
# news_items tagged feed_name='YouTube Podcast', then the podcast composer picks
# two different unused interviews published within the last 7 days.
#
# Schema:
#   - url:            required. @handle or @handle/videos
#   - topic_category: optional. one of news_radar's taxonomy ids.
#   - max_videos:     optional. Keep LOW (1) for long-form content.
#
# 設計原則：
#   - 保留所有 resolve 得到的 handle（即使無字幕。無字幕 = pipeline 自動 skip）
#   - 標註每個源的驗證狀態
#   - 不刪也不加未經 yt-dlp 驗證的源
#
# 驗證：bash tools/test_podcast_sources.sh
# ===========================================================================

sources:

