  - url: https://www.youtube.com/@20VC/videos
    topic_category: other
    max_videos: 1

  - url: https://www.youtube.com/@MyFirstMillionPod/videos
    topic_category: other
    max_videos: 1

  # --- 公司深拆 / 綜合 (Acquired, All-In) ---
  - url: https://www.youtube.com/@AcquiredFM/videos
