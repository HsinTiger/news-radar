# News Radar · AI 專欄（週二、四）的 YouTube 來源（2026-10-18 建立）
# ===========================================================================
# 定位：AI 方法論、系統導入、工程實務；兼顧晶片硬體、系統設計、治理與社會。
# 收進 news_items 的 feed_name='YouTube AI'，跟吹牛免稅的 'YouTube Podcast' 分開，
# 兩個專欄不會搶同一集。下面每個頻道都在 2026-10-17／18 用 yt-dlp 實測過：
# 近 30 天有更新、以長片為主、最新長片有英文字幕（沒字幕的流程抓不到）。
# 淘汰紀錄：OpenAI／Anthropic／NVIDIA／DeepMind 官方（幾乎都是短宣傳片）、
# Palantir（講企業落地但沒字幕）、Karpathy／Changelog／Nathan Lambert（停更）、
# Redpoint（一個月 1 集）、CSIS（多談國際局勢）。
#
# Schema 同 substack_podcast_sources.yaml：url（@handle/videos）、topic_category、max_videos
# ===========================================================================

