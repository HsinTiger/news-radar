name: News Radar · Full Cloud Pipeline

# ============================================================
# 2026-06-01: 完整雲端流程，每階段有獨立驗證腳本
#              verifier_*.py 與生產腳本完全分離 — 避免球員兼裁判
#
# 流程: setup → harvest→verify → compose→verify → publish→verify → engagement → persist
# ============================================================

on:
  # Scheduling is owned by adaptive-scheduler.yml.  This workflow is an
  # execution worker and never decides its own frequency.
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish (ignore cadence)"
        required: false
        default: "false"
        type: boolean
      platforms:
        description: "Canonical comma list: facebook,instagram,threads"
        required: false
        default: "facebook,instagram,threads"
        type: string
      dispatch_reason:
        description: "Governed scheduler evidence marker"
        required: false
        default: "manual"
        type: string
      automation_mode:
        description: "Execution contract: paused, recovery, or live"
        required: false
        default: "paused"
        type: choice
        options:
          - paused
          - recovery
          - live

concurrency:
  # All DB writers and external publishers share this group across workflows.
  group: news-radar-production
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      AUTOMATION_MODE: ${{ inputs.automation_mode || vars.AUTOMATION_MODE || 'paused' }}
      DISPATCH_REASON: ${{ inputs.dispatch_reason || 'manual' }}
      # 2026-06-27 啟用時段選題路由：晚=政治桶、早午=市場桶（soft bias、桶空自動退回最新）。
      # 關掉就把這行刪掉/設空＝全線回舊行為（活下去）。Mac compose 端不設此旗、不受影響。
      EDITORIAL_MODE: "1"
      EDITOR_ENFORCE: "1"
    timeout-minutes: 45

    steps:
      # ========== SETUP ==========
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          python -c "import litellm; print('litellm OK')"

      - name: Download cover fonts
        run: |
          mkdir -p assets/fonts
          BASE_SANS="https://github.com/adobe-fonts/source-han-sans/raw/release/OTF/TraditionalChinese"
          BASE_SERIF="https://github.com/adobe-fonts/source-han-serif/raw/release/OTF/TraditionalChinese"
          for f in SourceHanSansTC-Bold SourceHanSansTC-Regular SourceHanSerifTC-Light; do
            curl -sSL --fail-with-body -o "assets/fonts/${f}.otf" \
              "${BASE_SANS}/${f}.otf" 2>/dev/null || \
            curl -sSL --fail-with-body -o "assets/fonts/${f}.otf" \
              "${BASE_SERIF}/${f}.otf" 2>/dev/null || true
          done

      - name: Acquire canonical state write lease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py lock --repo "$GITHUB_REPOSITORY" \
            --producer "github:${{ github.workflow }}:${{ github.run_id }}" \
            --lease-file .runtime-state-lease.json

      - name: Restore verified runtime state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          for dir in data/01_harvest logs state archive data/05_reflect/proposals data/03_compose/pending_drafts; do
            mkdir -p "$dir"
          done
          python scripts/state_store.py pull --repo "$GITHUB_REPOSITORY" --root .
          python -c "from scripts.state_store import validate_database; from pathlib import Path; print(validate_database(Path('data/01_harvest/news_radar.db')))"

      - name: Prime harvest throttle (skip if existing)
        run: |
          if [ ! -f state/last_harvest.txt ]; then
            # Write a timestamp 2h ago to prevent harvest throttle on first run
            date -u -v-2H +%Y-%m-%dT%H:%M:%S+00:00 > state/last_harvest.txt 2>/dev/null || \
            python3 -c "from pathlib import Path; Path('state/last_harvest.txt').write_text('2026-06-01T00:00:00+00:00')"
          fi

      - name: Apply owner-approved Recovery topic policy
        if: env.AUTOMATION_MODE == 'recovery'
        run: |
          python scripts/bootstrap_social_policy.py --apply \
            --decided-at "2026-07-24T15:09:14+08:00"

      # ========== STAGE 0: USER SUBMISSIONS ==========
      - name: "📤 [STAGE] Process user-submitted sources"
        run: |
          set -o pipefail
          echo "=== Pending Sources ==="
          python scripts/submit_source.py --from-pending 2>&1 | tee logs/submissions_last.log
          echo "=== Sources Complete ==="

      # ========== STAGE 1: HARVEST ==========
      - name: "🌾 [STAGE] Harvest RSS → clean → DB"
        id: harvest
        run: |
          set -o pipefail
          python run_harvest.py 2>&1 | tee logs/harvest_last.log

      - name: "🔍 [VERIFY] Harvest — independent verifier script"
        if: always()
        run: |
          echo "=== Harvest Verification (scripts/verify_harvest.py) ==="
          python scripts/verify_harvest.py 2>&1
          echo "=== Verdict ==="

      # ========== STAGE 2: SCORE + COMPOSE ==========
      - name: Mark exact compose verification boundary
        run: |
          python -c "from datetime import datetime, timezone; from pathlib import Path; Path('state/compose_started_at.txt').write_text(datetime.now(timezone.utc).isoformat(), encoding='utf-8')"

      - name: "🤖 [STAGE] Score + Compose (LiteLLM cloud)"
        id: compose
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITELLM_MODEL: gemini/gemini-2.5-flash
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python run_pipeline.py --compose-only \
            --platforms "${{ inputs.platforms || 'facebook,instagram,threads' }}" \
            2>&1 | tee logs/pipeline_last.log

      - name: "🔍 [VERIFY] Compose — independent verifier script"
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          echo "=== Compose Verification (scripts/verify_compose.py) ==="
          python scripts/verify_compose.py \
            --since-iso "$(cat state/compose_started_at.txt)" \
            --platforms "${{ inputs.platforms || 'facebook,instagram,threads' }}" 2>&1
          echo "=== Verdict ==="

      # ========== STAGE 3: PUBLISH ==========
      - name: "📤 [STAGE] Publish to FB/IG/Threads"
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: "1"
        run: |
          python run_publish_queue.py --no-fallback \
            --platforms "${{ inputs.platforms || 'facebook,instagram,threads' }}" \
            2>&1 | tee logs/publish_last.log

      - name: "🔍 [VERIFY] Publish — independent verifier script"
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Publish Verification (scripts/verify_publish.py) ==="
          python scripts/verify_publish.py --since-minutes 30 --require-attempt \
            --platforms "${{ inputs.platforms || 'facebook,instagram,threads' }}" 2>&1
          echo "=== Verdict ==="

      - name: "🌐 [VERIFY] Meta remote readback — independent verifier"
        if: always()
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Remote Publish Readback (scripts/verify_remote_publish.py) ==="
          python scripts/verify_remote_publish.py --since-minutes 30 \
            --platforms "${{ inputs.platforms || 'facebook,instagram,threads' }}" 2>&1
          echo "=== Verdict ==="

      # ========== STAGE 4: ENGAGEMENT POLLING ==========
      - name: "📊 [STAGE] Poll engagement data"
        id: engagement
        continue-on-error: true
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m src.engagement 2>&1 | tee logs/engagement_last.log

      # ========== STAGE 4.5: FEEDBACK LOOP ==========
      - name: "\U0001f504 [STAGE] Feedback loop — analytics + recommendations"
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Feedback Loop ==="
          python -m src.feedback_loop --mode write 2>&1 | tee logs/feedback_last.log
          python -m src.iteration_engine --mode report 2>&1 | tee logs/iteration_last.log
          echo "=== Feedback Complete ==="

      - name: "📈 Sync governed operational metadata to Social Ops"
        if: always()
        env:
          SOCIAL_OPS_API_URL: ${{ vars.SOCIAL_OPS_API_URL }}
          SOCIAL_OPS_SERVICE_TOKEN: ${{ secrets.SOCIAL_OPS_SERVICE_TOKEN }}
        run: python scripts/sync_social_ops.py --knowledge-limit 500

      # ========== STAGE 5: PERSIST VERIFIED RELEASE STATE ==========
      - name: "💾 Persist verified runtime state"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py push \
            --repo "$GITHUB_REPOSITORY" \
            --root . \
            --producer "full_pipeline:${{ github.run_id }}" \
            --lease-file .runtime-state-lease.json

      - name: Release canonical state write lease
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py unlock --repo "$GITHUB_REPOSITORY" \
            --lease-file .runtime-state-lease.json

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            logs/
            data/01_harvest/news_radar.db
            reports/
            data/03_compose/pending_drafts/
          retention-days: 14
          if-no-files-found: warn
