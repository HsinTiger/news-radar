name: News Radar · Full Cloud Pipeline

# ============================================================
# 2026-06-01: 完整雲端流程，每階段有獨立驗證腳本
#              verifier_*.py 與生產腳本完全分離 — 避免球員兼裁判
#
# 流程: setup → harvest→verify → compose→verify → publish→verify → engagement → persist
# ============================================================

on:
  schedule:
    # 2026-06-27 改：FB/IG（carousel）一天兩篇，挑台灣滑手機尖峰——早上起床 + 晚上到家。
    # 少而好（信哥拍板：砍量、只發尖峰），取代原本每 2 小時一輪的洗版。台灣 = UTC+8。
    # 排程刻意稍早於目標，吸收 GitHub Actions 排程延遲(~5–15min) + pipeline 跑稿(~6min)：
    #   23:45 UTC = 07:45 台灣 → 貼文約 08:00 台灣（起床 / 通勤滑手機）
    #   12:45 UTC = 20:45 台灣 → 貼文約 21:00 台灣（下班到家放鬆滑手機）
    # 註：目前 Threads 也走同一條 carousel pipeline，會跟著一天兩篇；等 Threads 立場前線
    #     獨立出來後再給它自己的節奏。Reels 仍走 reels_publish.yml（另議）。
    - cron: "45 23,12 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish (ignore cadence)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: news-radar-full-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 45

    steps:
      # ========== SETUP ==========
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: state
          path: _state

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          python -c "import litellm; print('litellm OK')"

      - name: Download cover fonts
        run: |
          mkdir -p assets/fonts
          BASE_SANS="https://github.com/adobe-fonts/source-han-sans/raw/release/OTF/TraditionalChinese"
          BASE_SERIF="https://github.com/adobe-fonts/source-han-serif/raw/release/OTF/TraditionalChinese"
          for f in SourceHanSansTC-Bold SourceHanSansTC-Regular SourceHanSerifTC-Light; do
            curl -sSL --fail-with-body -o "assets/fonts/${f}.otf" \
              "${BASE_SANS}/${f}.otf" 2>/dev/null || \
            curl -sSL --fail-with-body -o "assets/fonts/${f}.otf" \
              "${BASE_SERIF}/${f}.otf" 2>/dev/null || true
          done

      - name: Restore DB from state branch
        run: |
          for dir in data/01_harvest logs state archive data/05_reflect/proposals data/03_compose/pending_drafts; do
            mkdir -p "$dir"
          done
          if [ -f _state/data/01_harvest/news_radar.db ]; then
            cp _state/data/01_harvest/news_radar.db data/01_harvest/news_radar.db
            echo "[restore] DB: $(du -h data/01_harvest/news_radar.db | cut -f1)"
          else
            echo "[restore] no existing DB"
          fi
          for src in logs archive state/last_harvest.txt data/05_reflect/proposals; do
            [ -f "_state/$src" ] && cp "_state/$src" "$src" 2>/dev/null || true
            [ -d "_state/$src" ] && cp -r "_state/$src/." "${src}/" 2>/dev/null || true
          done

      - name: Prime harvest throttle (skip if existing)
        run: |
          if [ ! -f state/last_harvest.txt ]; then
            # Write a timestamp 2h ago to prevent harvest throttle on first run
            date -u -v-2H +%Y-%m-%dT%H:%M:%S+00:00 > state/last_harvest.txt 2>/dev/null || \
            python3 -c "from pathlib import Path; Path('state/last_harvest.txt').write_text('2026-06-01T00:00:00+00:00')"
          fi

      # ========== STAGE 0: USER SUBMISSIONS ==========
      - name: "📤 [STAGE] Process user-submitted sources"
        continue-on-error: true
        run: |
          echo "=== Pending Sources ==="
          python scripts/submit_source.py --from-pending 2>&1 | tee logs/submissions_last.log
          echo "=== Sources Complete ==="

      # ========== STAGE 1: HARVEST ==========
      - name: "🌾 [STAGE] Harvest RSS → clean → DB"
        id: harvest
        run: |
          python run_harvest.py 2>&1 | tee logs/harvest_last.log

      - name: "🔍 [VERIFY] Harvest — independent verifier script"
        if: always()
        continue-on-error: true
        run: |
          echo "=== Harvest Verification (scripts/verify_harvest.py) ==="
          python scripts/verify_harvest.py 2>&1
          echo "=== Verdict ==="

      # ========== STAGE 2: SCORE + COMPOSE ==========
      - name: "🤖 [STAGE] Score + Compose (LiteLLM cloud)"
        id: compose
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LITELLM_MODEL: gemini/gemini-2.5-flash
          PYTHONUNBUFFERED: "1"
        run: |
          python run_pipeline.py --compose-only 2>&1 | tee logs/pipeline_last.log

      - name: "🔍 [VERIFY] Compose — independent verifier script"
        if: always()
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Compose Verification (scripts/verify_compose.py) ==="
          python scripts/verify_compose.py 2>&1
          echo "=== Verdict ==="

      # ========== STAGE 3: PUBLISH ==========
      - name: "📤 [STAGE] Publish to FB/IG/Threads"
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: "1"
        run: |
          python run_publish_queue.py --force 2>&1 | tee logs/publish_last.log

      - name: "🔍 [VERIFY] Publish — independent verifier script"
        if: always()
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Publish Verification (scripts/verify_publish.py) ==="
          python scripts/verify_publish.py 2>&1
          echo "=== Verdict ==="

      # ========== STAGE 4: ENGAGEMENT POLLING ==========
      - name: "📊 [STAGE] Poll engagement data"
        id: engagement
        continue-on-error: true
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m src.engagement 2>&1 | tee logs/engagement_last.log

      # ========== STAGE 4.5: FEEDBACK LOOP ==========
      - name: "\U0001f504 [STAGE] Feedback loop — analytics + recommendations"
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Feedback Loop ==="
          python -m src.feedback_loop --mode write 2>&1 | tee logs/feedback_last.log
          python -m src.iteration_engine --mode report 2>&1 | tee logs/iteration_last.log
          echo "=== Feedback Complete ==="

      # ========== STAGE 5: PERSIST TO STATE BRANCH ==========
      - name: "💾 Persist state to state branch"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          STATE_DIR="$(mktemp -d)"
          cd "$STATE_DIR"
          git init -q -b state
          git config user.name "news-radar-bot"
          git config user.email "noreply@github.com"

          for dir in data/01_harvest logs state archive data/05_reflect/proposals data/05_reflect/feedback; do
            mkdir -p "$dir"
          done

          if [ -f "$GITHUB_WORKSPACE/data/01_harvest/news_radar.db" ]; then
            cp "$GITHUB_WORKSPACE/data/01_harvest/news_radar.db" data/01_harvest/news_radar.db
          fi
          if [ -d "$GITHUB_WORKSPACE/logs" ]; then
            cp -r "$GITHUB_WORKSPACE/logs/." logs/ 2>/dev/null || true
          fi
          if [ -d "$GITHUB_WORKSPACE/archive" ]; then
            cp -r "$GITHUB_WORKSPACE/archive/." archive/ 2>/dev/null || true
          fi
          if [ -f "$GITHUB_WORKSPACE/state/last_harvest.txt" ]; then
            cp "$GITHUB_WORKSPACE/state/last_harvest.txt" state/last_harvest.txt
          fi
          if [ -d "$GITHUB_WORKSPACE/data/05_reflect/proposals" ]; then
            cp -r "$GITHUB_WORKSPACE/data/05_reflect/proposals/." data/05_reflect/proposals/ 2>/dev/null || true
          fi
          if [ -d "$GITHUB_WORKSPACE/data/05_reflect/feedback" ]; then
            mkdir -p data/05_reflect/feedback
            cp -r "$GITHUB_WORKSPACE/data/05_reflect/feedback/." data/05_reflect/feedback/ 2>/dev/null || true
          fi

          cat > LAST_RUN.txt <<EOF
          last_run_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          run_id: ${RUN_ID}
          run_url: ${RUN_URL}
          commit: ${COMMIT}
          kind: full_pipeline
          EOF

          if [ -f data/01_harvest/news_radar.db ]; then
            echo "db_size: $(du -h data/01_harvest/news_radar.db | cut -f1)" >> LAST_RUN.txt
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "[persist] 無變化，跳過推送"
            exit 0
          fi
          git commit -q -m "state: full_pipeline run ${RUN_ID}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            state

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            logs/
            data/01_harvest/news_radar.db
            reports/
            data/03_compose/pending_drafts/
          retention-days: 14
          if-no-files-found: warn
