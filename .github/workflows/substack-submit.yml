name: 📝 Substack Submit (手動提交 → Substack 草稿)
run-name: "📝 Substack: ${{ inputs.note || inputs.content }}"

# Substack counterpart to submit-source.yml (which is Meta fb/ig/threads).
# This writes the submitted source into the canonical Release-state DB tagged
# `substack_source` (feed_name=user_substack). The Mac's hourly sync pulls the
# Release state; then the local launchd job composes the draft via
# substack_radar/compose.py (Claude/Gemini CLI). Drafts land on the Mac +
# OneDrive + Substack — composition is NOT done in the cloud (no CLI there).

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "來源類型"
        required: true
        default: "url"
        type: choice
        options:
          - url
          - text
          - youtube
          - image
      content:
        description: "內容（URL / 全文 / YouTube 網址 / 圖片路徑逗號分隔）"
        required: true
        type: string
      note:
        description: "備註 / 標題（選填）"
        required: false
        type: string
      immediate:
        description: "立即寫稿（Mac 每 5 分鐘的快速 drain 優先處理，不等每小時排程）"
        required: false
        default: "false"
        type: string
      publish_now:
        description: "After reader-ready and cover gates, publish the same remote draft"
        required: false
        default: "false"
        type: string
      submission_id:
        description: "Control-plane submission ID"
        required: false
        default: ""
        type: string
      variant:
        description: "重產新版本：當成獨立的新稿，不併入同一素材的舊投稿"
        required: false
        default: "false"
        type: string

concurrency:
  group: news-radar-production
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  submit:
    runs-on: ubuntu-latest
    # 原本 10 分鐘。Mac 寫稿時會佔著寫入鎖（中午那輪兩篇可到 60–70 分鐘），雲端等
    # 不到就撞上 10 分鐘上限被強制中止——2026-09 四筆失敗投稿有三筆是這個原因。
    # repo 是 public，Actions 分鐘不計費，等久一點沒有成本。
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -q

      - name: Acquire canonical state write lease
        id: lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py lock --repo "$GITHUB_REPOSITORY" \
            --producer "github:${{ github.workflow }}:${{ github.run_id }}" \
            --lease-file .runtime-state-lease.json \
            --wait-seconds 4800

      - name: Restore verified runtime state
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py pull --repo "$GITHUB_REPOSITORY" --root .

      - name: Process Substack submission
        id: process
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          case "${{ inputs.source_type }}" in
            url)     FLAG=--url ;;
            text)    FLAG=--text ;;
            youtube) FLAG=--yt ;;
            image)   FLAG=--images ;;
            *)       echo "unknown source_type"; exit 1 ;;
          esac
          IMM=""
          [ "${{ inputs.immediate }}" = "true" ] && IMM="--immediate"
          PUB=""
          [ "${{ inputs.publish_now }}" = "true" ] && PUB="--publish-now"
          VAR=""
          [ "${{ inputs.variant }}" = "true" ] && VAR="--variant"
          python scripts/submit_substack.py \
            "$FLAG" "${{ inputs.content }}" \
            --note "${{ inputs.note }}" \
            --submission-id "${{ inputs.submission_id }}" $IMM $PUB $VAR 2>&1

      - name: Persist verified runtime state
        id: persist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py push \
            --repo "$GITHUB_REPOSITORY" --root . \
            --producer "substack_submission:${{ inputs.submission_id || github.run_id }}" \
            --lease-file .runtime-state-lease.json

      - name: Release canonical state write lease
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py unlock --repo "$GITHUB_REPOSITORY" \
            --lease-file .runtime-state-lease.json

      - name: Report truthful submission state
        if: always() && inputs.submission_id != ''
        env:
          SOCIAL_OPS_API_URL: ${{ vars.SOCIAL_OPS_API_URL }}
          SOCIAL_OPS_SERVICE_TOKEN: ${{ secrets.SOCIAL_OPS_SERVICE_TOKEN }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          LOCK_STATUS: ${{ steps.lock.outcome }}
          RESTORE_STATUS: ${{ steps.restore.outcome }}
          PROCESS_STATUS: ${{ steps.process.outcome }}
          PERSIST_STATUS: ${{ steps.persist.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # This workflow queues a source. It does NOT prove a Substack draft exists.
          STATUS="source_queued"
          [ "$PROCESS_STATUS" = "success" ] && [ "$PERSIST_STATUS" = "success" ] || STATUS="failed"
          # 失敗要寫原因，手機上的投稿紀錄才看得出為什麼（原本一律只有「失敗」兩字）。
          ERROR=""
          if [ "$STATUS" = "failed" ]; then
            if [ "$LOCK_STATUS" != "success" ]; then
              ERROR="等不到寫入鎖：Mac 正在寫稿，80 分鐘內沒有釋放（可直接按一鍵重產）"
            elif [ "$RESTORE_STATUS" != "success" ]; then
              ERROR="下載雲端狀態檔失敗，多半是網路暫時不穩（可直接按一鍵重產）"
            elif [ "$PROCESS_STATUS" != "success" ]; then
              ERROR="素材處理失敗：網址打不開或抓不到內容，詳見執行紀錄"
            else
              ERROR="狀態寫回失敗，多半是網路暫時不穩（可直接按一鍵重產）"
            fi
          fi
          python scripts/control_plane.py status "$SUBMISSION_ID" "$STATUS" \
            --workflow-run-url "$RUN_URL" --error "$ERROR"
