name: 📤 Submit Source (手動提交)
run-name: "📱 Meta: ${{ inputs.note || inputs.content }}"

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "來源類型"
        required: true
        default: "url"
        type: choice
        options:
          - url
          - text
          - youtube
          - image
      content:
        description: "內容（URL / 全文 / YouTube 網址 / 圖片路徑逗號分隔）"
        required: true
        type: string
      platforms:
        description: "目標平台（逗號分隔: fb,ig,threads）"
        required: false
        default: "fb,ig,threads"
        type: string
      note:
        description: "備註 / 標題（選填）"
        required: false
        type: string
      submission_id:
        description: "Control-plane submission ID"
        required: false
        default: ""
        type: string

concurrency:
  group: news-radar-production
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -q

      - name: Acquire canonical state write lease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py lock --repo "$GITHUB_REPOSITORY" \
            --producer "github:${{ github.workflow }}:${{ github.run_id }}" \
            --lease-file .runtime-state-lease.json

      - name: Restore verified runtime state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py pull --repo "$GITHUB_REPOSITORY" --root .

      - name: Process submission
        id: process
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          case "${{ inputs.source_type }}" in
            url)     FLAG=--url ;;
            text)    FLAG=--text ;;
            youtube) FLAG=--yt ;;
            image)   FLAG=--images ;;
            *)       echo "unknown source_type"; exit 1 ;;
          esac
          python scripts/submit_source.py \
            "$FLAG" "${{ inputs.content }}" \
            --platforms "${{ inputs.platforms }}" \
            --submission-id "${{ inputs.submission_id }}" \
            --note "${{ inputs.note }}" 2>&1

      - name: Persist verified runtime state
        id: persist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py push \
            --repo "$GITHUB_REPOSITORY" --root . \
            --producer "meta_submission:${{ inputs.submission_id || github.run_id }}" \
            --lease-file .runtime-state-lease.json

      - name: Release canonical state write lease
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py unlock --repo "$GITHUB_REPOSITORY" \
            --lease-file .runtime-state-lease.json

      - name: Report truthful submission state
        if: always() && inputs.submission_id != ''
        env:
          SOCIAL_OPS_API_URL: ${{ vars.SOCIAL_OPS_API_URL }}
          SOCIAL_OPS_SERVICE_TOKEN: ${{ secrets.SOCIAL_OPS_SERVICE_TOKEN }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          PROCESS_STATUS: ${{ steps.process.outcome }}
          PERSIST_STATUS: ${{ steps.persist.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS="content_queued"
          [ "$PROCESS_STATUS" = "success" ] && [ "$PERSIST_STATUS" = "success" ] || STATUS="failed"
          python scripts/control_plane.py status "$SUBMISSION_ID" "$STATUS" --workflow-run-url "$RUN_URL"
