name: "Social Automation · Governed Scheduler"

on:
  schedule:
    # GitHub schedule delivery is best-effort and has arrived 1-3 hours late.
    # Use one primary plus one backup hour for each governed local slot; the
    # recovery policy catches up only after the slot and before its deadline.
    # UTC 00/03,10/11,12/13 = Taipei 08/11,18/19,20/21.
    - cron: "17 0,3 * * *"
    - cron: "17 10,11 * * *"
    - cron: "17 12,13 * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Optional ISO timestamp for replay"
        required: false
        default: ""
        type: string
      setup_only:
        description: "Decision evidence only; never dispatch the publishing pipeline"
        required: true
        default: true
        type: boolean
      trigger_source:
        description: "Auditable dispatch authority"
        required: true
        default: "manual"
        type: choice
        options:
          - "manual"
          - "cloudflare_watchdog"
      watchdog_dispatch_id:
        description: "Cloudflare watchdog lineage identifier"
        required: false
        default: ""
        type: string

concurrency:
  # Serialize the decision reader with state writers and publishers. A later
  # redundant tick must wait for the in-flight pipeline to persist its result
  # before deciding whether the daily quota is still due.
  group: news-radar-production
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  decide:
    # Recovery is a bounded, platform-specific envelope; paused remains a hard stop.
    if: vars.AUTOMATION_MODE == 'live' || vars.AUTOMATION_MODE == 'recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal dependencies
        run: pip install httpx==0.28.1
      - name: Restore verified runtime state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/state_store.py pull --repo "$GITHUB_REPOSITORY" --root .
      - name: Decide bounded schedule
        id: policy
        env:
          REQUESTED_NOW: ${{ inputs.now }}
          AUTOMATION_MODE: ${{ vars.AUTOMATION_MODE }}
        run: |
          EXTRA=()
          [ -n "$REQUESTED_NOW" ] && EXTRA=(--now "$REQUESTED_NOW")
          python scripts/adaptive_dispatch.py --mode "$AUTOMATION_MODE" "${EXTRA[@]}"
      - name: Dispatch production pipeline
        if: >-
          steps.policy.outputs.dispatch == 'true' &&
          (github.event_name == 'schedule' || inputs.setup_only == false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORMS: ${{ steps.policy.outputs.platforms }}
          AUTOMATION_MODE: ${{ vars.AUTOMATION_MODE }}
        run: |
          gh workflow run full_pipeline.yml \
            --ref main \
            -f platforms="$PLATFORMS" \
            -f automation_mode="$AUTOMATION_MODE" \
            -f dispatch_reason="adaptive-scheduler:${{ github.run_id }}"
      - name: Record real scheduler delivery heartbeat
        if: always() && github.event_name == 'schedule'
        env:
          SOCIAL_OPS_API_URL: ${{ vars.SOCIAL_OPS_API_URL }}
          SOCIAL_OPS_SERVICE_TOKEN: ${{ secrets.SOCIAL_OPS_SERVICE_TOKEN }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/scheduler_heartbeat.py
      - name: Record Cloudflare watchdog delivery heartbeat
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.trigger_source == 'cloudflare_watchdog'
        env:
          SOCIAL_OPS_API_URL: ${{ vars.SOCIAL_OPS_API_URL }}
          SOCIAL_OPS_SERVICE_TOKEN: ${{ secrets.SOCIAL_OPS_SERVICE_TOKEN }}
          SCHEDULER_WATCHDOG_SOURCE: ${{ inputs.trigger_source }}
          SCHEDULER_WATCHDOG_DISPATCH_ID: ${{ inputs.watchdog_dispatch_id }}
        run: python scripts/scheduler_watchdog_heartbeat.py
      - name: Upload decision evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schedule-decision-${{ github.run_id }}
          path: reports/schedule_decision.json
          retention-days: 30
          if-no-files-found: warn
