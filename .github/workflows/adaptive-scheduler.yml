name: "Social Automation · Governed Scheduler"

on:
  schedule:
    # GitHub schedule delivery is best-effort. Use four off-peak opportunities
    # inside each approved 0-50 minute window, and do not wake the 108 MB state
    # reader during unrelated hours. UTC 00/10/12 = Taipei 08/18/20.
    - cron: "7,22,37,47 0,10,12 * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Optional ISO timestamp for replay"
        required: false
        default: ""
        type: string

concurrency:
  group: news-radar-scheduler
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  decide:
    # Recovery is a bounded, platform-specific envelope; paused remains a hard stop.
    if: vars.AUTOMATION_MODE == 'live' || vars.AUTOMATION_MODE == 'recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal dependencies
        run: pip install httpx==0.28.1
      - name: Restore verified runtime state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/state_store.py pull --repo "$GITHUB_REPOSITORY" --root .
      - name: Decide bounded schedule
        id: policy
        env:
          REQUESTED_NOW: ${{ inputs.now }}
          AUTOMATION_MODE: ${{ vars.AUTOMATION_MODE }}
        run: |
          EXTRA=()
          [ -n "$REQUESTED_NOW" ] && EXTRA=(--now "$REQUESTED_NOW")
          python scripts/adaptive_dispatch.py --mode "$AUTOMATION_MODE" "${EXTRA[@]}"
      - name: Dispatch production pipeline
        if: steps.policy.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORMS: ${{ steps.policy.outputs.platforms }}
          AUTOMATION_MODE: ${{ vars.AUTOMATION_MODE }}
        run: |
          gh workflow run full_pipeline.yml \
            --ref main \
            -f platforms="$PLATFORMS" \
            -f automation_mode="$AUTOMATION_MODE" \
            -f dispatch_reason="adaptive-scheduler:${{ github.run_id }}"
      - name: Upload decision evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schedule-decision-${{ github.run_id }}
          path: reports/schedule_decision.json
          retention-days: 30
          if-no-files-found: warn
