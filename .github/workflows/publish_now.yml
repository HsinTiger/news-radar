name: News Radar · Publish Now (single URL)

# Immediate, on-demand publish of ONE article URL → fetch → compose → carousel
# to FB/IG/Threads, bypassing the 2h cron + the queue. Triggered manually or by
# the dashboard (workflow_dispatch). Shares the main pipeline's concurrency group
# so it never pushes cover-cdn at the same time as the scheduled run.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Article URL（擇一：url，或 title+text）"
        required: false
        default: ""
        type: string
      title:
        description: "標題（不抓 url 時，搭配 text）"
        required: false
        default: ""
        type: string
      text:
        description: "文章內文（不抓 url 時直接給文字）"
        required: false
        default: ""
        type: string
      platforms:
        description: "Comma list: fb,ig,threads"
        required: false
        default: "fb,ig,threads"
        type: string
      note:
        description: "Optional editorial hint for the composer"
        required: false
        default: ""
        type: string
      submission_id:
        description: "Control-plane submission ID / idempotency key"
        required: false
        default: ""
        type: string

concurrency:
  group: news-radar-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-now:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: Download cover fonts
        run: |
          mkdir -p assets/fonts
          BASE_SANS="https://github.com/adobe-fonts/source-han-sans/raw/release/OTF/TraditionalChinese"
          BASE_SERIF="https://github.com/adobe-fonts/source-han-serif/raw/release/OTF/TraditionalChinese"
          for f in SourceHanSansTC-Bold SourceHanSansTC-Regular SourceHanSerifTC-Light; do
            curl -sSL --fail-with-body -o "assets/fonts/${f}.otf" \
              "${BASE_SANS}/${f}.otf" 2>/dev/null || \
            curl -sSL --fail-with-body -o "assets/fonts/${f}.otf" \
              "${BASE_SERIF}/${f}.otf" 2>/dev/null || true
          done

      - name: Acquire canonical state write lease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py lock --repo "$GITHUB_REPOSITORY" \
            --producer "github:${{ github.workflow }}:${{ github.run_id }}" \
            --lease-file .runtime-state-lease.json

      - name: Restore verified runtime state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/state_store.py pull --repo "$GITHUB_REPOSITORY" --root .

      - name: "🚀 Publish now"
        id: publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LITELLM_MODEL: gemini/gemini-2.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p logs
          set +e
          python scripts/publish_now.py \
            --url "${{ inputs.url }}" \
            --title "${{ inputs.title }}" \
            --text "${{ inputs.text }}" \
            --platforms "${{ inputs.platforms }}" \
            --submission-id "${{ inputs.submission_id }}" \
            --result-json logs/publish_now_result.json \
            --note "${{ inputs.note }}" 2>&1 | tee logs/publish_now_last.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          RESULT_STATUS=$(python -c "import json; print(json.load(open('logs/publish_now_result.json', encoding='utf-8')).get('status','failed'))" 2>/dev/null || echo failed)
          echo "result_status=$RESULT_STATUS" >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: Persist verified runtime state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py push \
            --repo "$GITHUB_REPOSITORY" --root . \
            --producer "publish_now:${{ inputs.submission_id || github.run_id }}" \
            --lease-file .runtime-state-lease.json

      - name: Sync governed operational metadata to Social Ops
        if: always()
        env:
          SOCIAL_OPS_API_URL: ${{ vars.SOCIAL_OPS_API_URL }}
          SOCIAL_OPS_SERVICE_TOKEN: ${{ secrets.SOCIAL_OPS_SERVICE_TOKEN }}
        run: python scripts/sync_social_ops.py --knowledge-limit 500

      - name: Release canonical state write lease
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py unlock --repo "$GITHUB_REPOSITORY" \
            --lease-file .runtime-state-lease.json

      - name: Report truthful submission state
        if: always() && inputs.submission_id != ''
        env:
          SOCIAL_OPS_API_URL: ${{ vars.SOCIAL_OPS_API_URL }}
          SOCIAL_OPS_SERVICE_TOKEN: ${{ secrets.SOCIAL_OPS_SERVICE_TOKEN }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          RESULT_STATUS: ${{ steps.publish.outputs.result_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS="${RESULT_STATUS:-failed}"
          case "$STATUS" in
            published|partial|quality_held|failed) ;;
            *) STATUS="failed" ;;
          esac
          python scripts/control_plane.py status "$SUBMISSION_ID" "$STATUS" --workflow-run-url "$RUN_URL"
