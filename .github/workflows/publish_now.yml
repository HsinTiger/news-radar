name: News Radar · Publish Now (single URL)

# Immediate, on-demand publish of ONE article URL → fetch → compose → carousel
# to FB/IG/Threads, bypassing the 2h cron + the queue. Triggered manually or by
# the dashboard (workflow_dispatch). Shares the main pipeline's concurrency group
# so it never pushes cover-cdn at the same time as the scheduled run.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Article URL to compose + publish now"
        required: true
        type: string
      platforms:
        description: "Comma list: fb,ig,threads"
        required: false
        default: "fb,ig,threads"
        type: string
      note:
        description: "Optional editorial hint for the composer"
        required: false
        default: ""
        type: string

concurrency:
  group: news-radar-full-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-now:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: Download cover fonts
        run: |
          mkdir -p assets/fonts
          BASE_SANS="https://github.com/adobe-fonts/source-han-sans/raw/release/OTF/TraditionalChinese"
          BASE_SERIF="https://github.com/adobe-fonts/source-han-serif/raw/release/OTF/TraditionalChinese"
          for f in SourceHanSansTC-Bold SourceHanSansTC-Regular SourceHanSerifTC-Light; do
            curl -sSL --fail-with-body -o "assets/fonts/${f}.otf" \
              "${BASE_SANS}/${f}.otf" 2>/dev/null || \
            curl -sSL --fail-with-body -o "assets/fonts/${f}.otf" \
              "${BASE_SERIF}/${f}.otf" 2>/dev/null || true
          done

      - name: "🚀 Publish now"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LITELLM_MODEL: gemini/gemini-2.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p logs
          python scripts/publish_now.py \
            --url "${{ inputs.url }}" \
            --platforms "${{ inputs.platforms }}" \
            --note "${{ inputs.note }}" 2>&1 | tee logs/publish_now_last.log
