name: News Radar · Publish Queue

# ------------------------------------------------------------
# Phase 8.18 雲本混合架構 —— Cloud 端「發稿」工作流
# 每小時整點（UTC）跑一次 run_publish_queue.py：
#   1. 從 state branch 拉回 DB（內含 Mac compose 好的 queued drafts）
#   2. 依 cadence 規則 + freshness-first 挑一筆發 FB / IG / Threads
#   3. 把更新後的 DB 推回 state branch
# **不呼叫任何 LLM**——brain work 留在 Mac（composer / scorer 在 Mac 端跑）。
# 這條工作流需要的 secrets 只有 Meta tokens（7 個），不需要 Gemini / Anthropic key。
# ------------------------------------------------------------

on:
  schedule:
    # UTC 整點每小時。Cadence 1h upper bound 保證實際不會每小時都發，
    # run_publish_queue.py 自己會 honour min_interval。
    # PAUSED 2026-05-22 · - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal        # 正常 cadence：1h upper / 2h lower
          - force         # 忽略 cadence，強制發一篇
          - dry-run       # 只選稿、印要發的內容，不呼叫 API

concurrency:
  # 與 Mac compose 的 push state branch 可能撞——state branch 是 force-push orphan 模式，
  # 撞了就是覆蓋，不會資料污染。但本 workflow 自己要 serialize 以免連續兩個 run 撞。
  group: news-radar-publish-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout state branch
        id: state_checkout
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: state
          path: _state

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Phase 9.5 / Phase 2: cover_renderer needs Source Han Sans/Serif TC
      # at assets/fonts/. Repo .gitignore excludes the .otf files (large +
      # OFL-licensed, easier to fetch than vendor), so we download them
      # fresh on each run. ~50 MB total, cached by setup-python's pip cache
      # is unrelated; a real cache would help but is overkill for now.
      - name: Download cover fonts
        run: |
          mkdir -p assets/fonts
          BASE_SANS="https://github.com/adobe-fonts/source-han-sans/raw/release/OTF/TraditionalChinese"
          BASE_SERIF="https://github.com/adobe-fonts/source-han-serif/raw/release/OTF/TraditionalChinese"
          curl -sSL --fail-with-body -o assets/fonts/SourceHanSansTC-Bold.otf "$BASE_SANS/SourceHanSansTC-Bold.otf"
          curl -sSL --fail-with-body -o assets/fonts/SourceHanSansTC-Regular.otf "$BASE_SANS/SourceHanSansTC-Regular.otf"
          curl -sSL --fail-with-body -o assets/fonts/SourceHanSerifTC-Light.otf "$BASE_SERIF/SourceHanSerifTC-Light.otf"
          ls -la assets/fonts/

      - name: Restore DB from state branch
        run: |
          mkdir -p data/01_harvest logs state archive data/05_reflect/proposals
          if [ -d _state ] && [ -f _state/data/01_harvest/news_radar.db ]; then
            cp _state/data/01_harvest/news_radar.db data/01_harvest/news_radar.db
            echo "[restore] DB 復原：$(du -h data/01_harvest/news_radar.db | cut -f1)"
          else
            echo "[restore] state branch 沒有 DB → queue 必定空，run_publish_queue 會直接 exit 0"
          fi
          if [ -d _state/logs ]; then
            cp -r _state/logs/. logs/ 2>/dev/null || true
          fi
          if [ -d _state/archive ]; then
            cp -r _state/archive/. archive/ 2>/dev/null || true
          fi
          # Phase 9 Item 2: carry proposals dir forward so reflector cron contributions
          # survive each hourly compose cycle. Without this, compose's orphan-push wipes
          # any proposals/ jsonl files written by reflect_*.yml workflows.
          if [ -d _state/data/05_reflect/proposals ]; then
            cp -r _state/data/05_reflect/proposals/. data/05_reflect/proposals/ 2>/dev/null || true
          fi

      - name: Run publish queue
        id: run
        env:
          # Phase 9.5 / Phase 2: cover_uploader pushes rendered PNGs to
          # the cover-cdn branch using this token. Default GITHUB_TOKEN
          # already has contents:write via the top-level permissions block.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Meta App（refresh_threads_token 會用到）
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # Facebook Page
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          # Instagram
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Threads
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          # 時區：台北
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: "1"
          # **注意**：不傳 GEMINI_API_KEY / ANTHROPIC_API_KEY。
          # Phase 8.18 契約：Cloud 端不呼叫 LLM，所以不需要 brain 的 API key。
        run: |
          MODE="${{ inputs.mode || 'normal' }}"
          echo "[run] mode=$MODE"
          case "$MODE" in
            force)
              python run_publish_queue.py --force
              ;;
            dry-run)
              python run_publish_queue.py --dry-run
              ;;
            *)
              python run_publish_queue.py
              ;;
          esac

      - name: Persist state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          STATE_DIR="$(mktemp -d)"
          cd "$STATE_DIR"
          git init -q -b state
          git config user.name "news-radar-bot"
          git config user.email "noreply@github.com"

          mkdir -p data/01_harvest logs state archive data/05_reflect/proposals
          if [ -f "$GITHUB_WORKSPACE/data/01_harvest/news_radar.db" ]; then
            cp "$GITHUB_WORKSPACE/data/01_harvest/news_radar.db" data/01_harvest/news_radar.db
          fi
          if [ -d "$GITHUB_WORKSPACE/logs" ]; then
            cp -r "$GITHUB_WORKSPACE/logs/." logs/ 2>/dev/null || true
          fi
          if [ -d "$GITHUB_WORKSPACE/archive" ]; then
            cp -r "$GITHUB_WORKSPACE/archive/." archive/ 2>/dev/null || true
          fi
          if [ -f "$GITHUB_WORKSPACE/state/last_harvest.txt" ]; then
            cp "$GITHUB_WORKSPACE/state/last_harvest.txt" state/last_harvest.txt
          fi
          # Phase 9 Item 2: include proposals dir in orphan-push staging
          if [ -d "$GITHUB_WORKSPACE/data/05_reflect/proposals" ]; then
            cp -r "$GITHUB_WORKSPACE/data/05_reflect/proposals/." data/05_reflect/proposals/ 2>/dev/null || true
          fi

          cat > LAST_RUN.txt <<EOF
          last_run_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          run_id: ${RUN_ID}
          run_url: ${RUN_URL}
          commit: ${COMMIT}
          kind: publish_queue
          EOF

          if [ -f data/01_harvest/news_radar.db ]; then
            echo "db_size: $(du -h data/01_harvest/news_radar.db | cut -f1)" >> LAST_RUN.txt
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "[persist] 無變化，跳過推送"
            exit 0
          fi
          git commit -q -m "state: publish_queue run ${RUN_ID} @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            state

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: publish-logs-${{ github.run_id }}
          path: |
            logs/
            data/01_harvest/news_radar.db
          retention-days: 14
          if-no-files-found: warn
