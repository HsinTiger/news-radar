name: News Radar · Scorer Analyzer (Daily)

# ------------------------------------------------------------
# Phase 9 Item 6 (2026-04-28) — daily per-platform AUTO_PUBLISH
# threshold optimization.
#
# Reads `v_post_engagement_aggregated` (Item 1 / Item 1.6 view substrate)
# and writes per-platform tune_threshold proposals to
# `data/05_reflect/proposals/YYYY-WW.jsonl` via the Item 2 write-path
# API. Calibration-phase (Phase 9 §8.4): every proposal is
# PROPOSAL-ONLY (boss_attention_required=True) — this analyzer never
# auto-deploys regardless of |delta|.
#
# Skip lineage rows (no jsonl entry) for:
#   - insufficient_samples (< 30 polled-published per platform)
#   - below_noise_floor (|delta| < 0.02)
#
# Runs daily at 04:00 UTC (≈ 12:00 Asia/Taipei) — chosen so it lands
# AFTER both the daily engagement-worker passes and AFTER Item 4's
# `reflect_harvest.yml` (03:00 UTC), avoiding same-time CI contention
# on the `news-radar-pipeline` concurrency group. Doesn't collide with
# `reflect_topic.yml` (Sun 22:00 UTC weekly).
# ------------------------------------------------------------

on:
  schedule:
    # Daily 04:00 UTC = 12:00 Asia/Taipei (one hour after harvest analyzer)
    # PAUSED 2026-05-22 · - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (no proposals written, no report file)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  # Shares DB writes (proposals lineage table) with pipeline.yml +
  # reflect_topic.yml + reflect_harvest.yml — serialize via the same
  # group key.
  group: news-radar-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reflect_scorer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout state branch
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: state
          path: _state

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore DB from state branch
        id: restore
        run: |
          mkdir -p data/01_harvest data/05_reflect/proposals logs
          if [ -d _state ] && [ -f _state/data/01_harvest/news_radar.db ]; then
            cp _state/data/01_harvest/news_radar.db data/01_harvest/news_radar.db
            echo "has_db=true" >> "$GITHUB_OUTPUT"
            echo "[restore] DB restored: $(du -h data/01_harvest/news_radar.db | cut -f1)"
          else
            echo "has_db=false" >> "$GITHUB_OUTPUT"
            echo "[restore] state branch has no DB → analyzer will report 0 polled samples and exit 0"
          fi
          # Carry over any existing proposals dir so this run appends to
          # the right ISO-week jsonl file rather than starting from empty.
          if [ -d _state/data/05_reflect/proposals ]; then
            cp -r _state/data/05_reflect/proposals/. data/05_reflect/proposals/ 2>/dev/null || true
          fi

      - name: Run scorer analyzer
        env:
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: "1"
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          echo "[reflect_scorer] flags=$FLAGS"
          python -m src.reflector.scorer $FLAGS | tee logs/reflect_scorer_last.log

      - name: Commit scorer report to main
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d reports ] || [ -z "$(ls -A reports 2>/dev/null)" ]; then
            echo "[report] no scorer report produced; skipping commit"
            exit 0
          fi
          git config user.name "news-radar-bot"
          git config user.email "noreply@github.com"
          git add reports/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "reflect: daily scorer analyzer (run ${{ github.run_id }})"
            git push
          else
            echo "[report] no new report files; skipping commit"
          fi

      - name: Persist state (DB + proposals dir)
        if: always() && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          STATE_DIR="$(mktemp -d)"
          cd "$STATE_DIR"
          git init -q -b state
          git config user.name "news-radar-bot"
          git config user.email "noreply@github.com"

          mkdir -p data/01_harvest data/05_reflect/proposals logs state archive
          if [ -f "$GITHUB_WORKSPACE/data/01_harvest/news_radar.db" ]; then
            cp "$GITHUB_WORKSPACE/data/01_harvest/news_radar.db" data/01_harvest/news_radar.db
          fi
          if [ -d "$GITHUB_WORKSPACE/data/05_reflect/proposals" ]; then
            cp -r "$GITHUB_WORKSPACE/data/05_reflect/proposals/." data/05_reflect/proposals/ 2>/dev/null || true
          fi
          if [ -d "$GITHUB_WORKSPACE/logs" ]; then
            cp -r "$GITHUB_WORKSPACE/logs/." logs/ 2>/dev/null || true
          fi
          if [ -f "$GITHUB_WORKSPACE/state/last_harvest.txt" ]; then
            cp "$GITHUB_WORKSPACE/state/last_harvest.txt" state/last_harvest.txt
          fi

          cat > LAST_RUN.txt <<EOF
          last_run_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          run_id: ${RUN_ID}
          kind: reflect_scorer
          EOF

          if [ -f data/01_harvest/news_radar.db ]; then
            echo "db_size: $(du -h data/01_harvest/news_radar.db | cut -f1)" >> LAST_RUN.txt
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "[persist] no changes; skipping push"
            exit 0
          fi
          git commit -q -m "state: reflect_scorer run ${RUN_ID}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            state

      - name: Upload report + log as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reflect-scorer-${{ github.run_id }}
          path: |
            reports/
            logs/reflect_scorer_last.log
            data/05_reflect/proposals/
          retention-days: 30
          if-no-files-found: warn
