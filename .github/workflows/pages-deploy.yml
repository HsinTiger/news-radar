name: 🌐 Pages · Deploy dashboard + manual-submit

# Single Pages deploy. GitHub Pages replaces the ENTIRE site on every deploy,
# so dashboard and manual-submit MUST be assembled in one workflow — otherwise
# whichever ran last clobbers the other (which is exactly what happened before).
#   dashboard      → https://hsintiger.github.io/news-radar/
#   manual-submit  → https://hsintiger.github.io/news-radar/manual-submit/

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'manual-submit/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assemble site (dashboard at root, manual-submit in subdir)
        run: |
          mkdir -p _site/manual-submit
          cp -r dashboard/*     _site/
          cp -r manual-submit/* _site/manual-submit/
          echo "✅ root:" && ls _site/
          echo "✅ manual-submit:" && ls _site/manual-submit/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
