name: 🌐 Pages · Deploy dashboard + submit frontends

# Single Pages deploy. GitHub Pages replaces the ENTIRE site on every deploy,
# so ALL pages MUST be assembled in one workflow — otherwise whichever ran last
# clobbers the others (which is exactly what happened before).
#   dashboard       → https://hsintiger.github.io/news-radar/ and /dashboard/
#   Meta 三平台      → https://hsintiger.github.io/news-radar/meta-submit/
#   Substack 草稿    → https://hsintiger.github.io/news-radar/substack-submit/
#   manual-submit   → https://hsintiger.github.io/news-radar/manual-submit/  (本機 server 版,保留)

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'manual-submit/**'
      - 'meta-submit/**'
      - 'substack-submit/**'
      - 'wiki/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assemble site (dashboard at root, submit pages in subdirs)
        run: |
          mkdir -p _site/dashboard _site/manual-submit _site/meta-submit _site/substack-submit _site/wiki
          cp -r dashboard/*       _site/
          cp -r dashboard/*       _site/dashboard/
          cp -r manual-submit/*   _site/manual-submit/
          cp -r meta-submit/*     _site/meta-submit/
          cp -r substack-submit/* _site/substack-submit/
          cp -r wiki/*            _site/wiki/
          echo "✅ root:"           && ls _site/
          echo "✅ meta-submit:"    && ls _site/meta-submit/
          echo "✅ substack-submit:" && ls _site/substack-submit/
          echo "✅ wiki:"           && ls _site/wiki/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages occasionally stays queued beyond the action's 10-minute
          # default even when the artifact and permissions are valid.
          timeout: 900000
