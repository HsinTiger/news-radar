name: "Social Automation · Operational Sync"

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: news-radar-operational-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install httpx==0.28.1
      - name: Restore verified runtime state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/state_store.py pull --repo "$GITHUB_REPOSITORY" --root .
      - name: Sync metadata and truthful terminal states
        env:
          SOCIAL_OPS_API_URL: ${{ vars.SOCIAL_OPS_API_URL }}
          SOCIAL_OPS_SERVICE_TOKEN: ${{ secrets.SOCIAL_OPS_SERVICE_TOKEN }}
        run: python scripts/sync_social_ops.py --knowledge-limit 500
