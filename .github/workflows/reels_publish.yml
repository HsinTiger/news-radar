name: "News Radar · Reels Maker"

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Publish target"
        default: "ig"
        type: choice
        options: [ig, fb, threads, none]

concurrency:
  group: news-radar-reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: Fonts
        run: |
          mkdir -p assets/fonts
          B="https://github.com/adobe-fonts/source-han-sans/raw/release/OTF/TraditionalChinese"
          curl -sSL -o assets/fonts/SourceHanSansTC-Bold.otf "$B/SourceHanSansTC-Bold.otf" 2>/dev/null || true

      - name: Restore DB
        run: |
          mkdir -p data/01_harvest data/reels logs
          git fetch origin state --depth=1 2>/dev/null || true
          git show origin/state:data/01_harvest/news_radar.db > data/01_harvest/news_radar.db 2>/dev/null || true

      - name: Generate Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          TITLE=$(python scripts/pick_latest_news.py | head -1)
          CONTENT=$(python scripts/pick_latest_news.py | tail -1)
          echo "Title: $TITLE"
          python scripts/reels_maker.py             --title "$TITLE"             --content "$CONTENT"             --output "$GITHUB_WORKSPACE/$GITHUB_WORKSPACE/data/reels/publish.mp4"             --publish none 2>&1 | tee logs/reels_last.log
          ls -la "$GITHUB_WORKSPACE/$GITHUB_WORKSPACE/data/reels/publish.mp4" || echo "publish.mp4 not found"
          # Fallback: try to find any mp4
          find data/reels -name "*.mp4" -type f 2>/dev/null | head -3

      - name: QC
        id: qc
        run: |
          if [ -f $GITHUB_WORKSPACE/data/reels/publish.mp4 ] && [ -s $GITHUB_WORKSPACE/data/reels/publish.mp4 ]; then
            python scripts/reels_maker.py --qc-only --output $GITHUB_WORKSPACE/$GITHUB_WORKSPACE/data/reels/publish.mp4
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        if: steps.qc.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: "1"
        run: |
          P="${{ inputs.publish_to || 'ig' }}"
          [ "$P" = "none" ] && exit 0
          TITLE=$(python scripts/pick_latest_news.py | head -1)
          python scripts/publish_reel.py $GITHUB_WORKSPACE/data/reels/publish.mp4 "$P" "$TITLE"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_id }}
          path: |
            logs/reels_last.log
            $GITHUB_WORKSPACE/data/reels/publish.mp4
            data/reels/*.mp4
          retention-days: 7
          if-no-files-found: warn
