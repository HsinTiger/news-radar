name: "News Radar · Reels Maker"

# Reels are render/QC-only while the owner contract requires every Meta feed
# post to use exactly three carousel cards.  This workflow deliberately has no
# independent cron and exposes no live publishing option.
on:
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Render/QC only; live Reel publishing is retired"
        default: "none"
        type: choice
        options: [none]
      draft_id:
        description: "Optional exact draft ID; otherwise pick newest unpublished"
        required: false
        default: ""
        type: string

concurrency:
  group: news-radar-production
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: Download fonts
        run: |
          mkdir -p assets/fonts
          SANS="https://github.com/adobe-fonts/source-han-sans/raw/release/OTF/TraditionalChinese"
          SERIF="https://github.com/adobe-fonts/source-han-serif/raw/release/OTF/TraditionalChinese"
          curl -sSL --fail-with-body -o assets/fonts/SourceHanSansTC-Bold.otf "$SANS/SourceHanSansTC-Bold.otf"
          curl -sSL --fail-with-body -o assets/fonts/SourceHanSerifTC-Light.otf "$SERIF/SourceHanSerifTC-Light.otf"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install HTML reel engine
        run: |
          cd reels_html
          npm ci --no-audit --no-fund -s
          CH=$(which google-chrome || which google-chrome-stable || which chromium-browser || true)
          test -n "$CH"
          echo "CHROME_PATH=$CH" >> "$GITHUB_ENV"
          "$CH" --version

      - name: Acquire canonical state write lease
        if: inputs.publish_to != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py lock --repo "$GITHUB_REPOSITORY" \
            --producer "github:${{ github.workflow }}:${{ github.run_id }}" \
            --lease-file .runtime-state-lease.json

      - name: Restore verified runtime state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p data/01_harvest data/reels logs
          python scripts/state_store.py pull --repo "$GITHUB_REPOSITORY" --root .

      - name: Select unpublished draft
        id: select
        env:
          REQUESTED_DRAFT: ${{ inputs.draft_id }}
          TARGET: ${{ inputs.publish_to }}
        run: |
          PLATFORM="$TARGET"
          [ "$PLATFORM" = "none" ] && PLATFORM="ig"
          if [ -n "$REQUESTED_DRAFT" ]; then
            DRAFT_ID="$REQUESTED_DRAFT"
          else
            DRAFT_ID=$(python scripts/pick_latest_draft.py --platform "$PLATFORM") || RC=$?
            if [ "${RC:-0}" = "2" ]; then
              echo "NO_CANDIDATE: every eligible draft already has a ${PLATFORM} reel"
              echo "draft_id=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "${RC:-0}" = "0" ] || exit "${RC:-1}"
          fi
          python - "$DRAFT_ID" <<'PY'
          import sqlite3, sys
          db = sqlite3.connect("data/01_harvest/news_radar.db")
          row = db.execute("SELECT id FROM drafts WHERE id = ?", (sys.argv[1],)).fetchone()
          db.close()
          if row is None:
              raise SystemExit(f"unknown draft_id: {sys.argv[1]}")
          PY
          echo "draft_id=$DRAFT_ID" >> "$GITHUB_OUTPUT"
          echo "Selected draft: $DRAFT_ID"

      - name: Generate reel
        if: steps.select.outputs.draft_id != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          DRAFT_ID: ${{ steps.select.outputs.draft_id }}
        run: |
          set -o pipefail
          python scripts/reels_maker.py --draft-id "$DRAFT_ID" --publish none 2>&1 | tee logs/reels_last.log
          LATEST=$(ls -t data/reels/*.mp4 2>/dev/null | head -1)
          test -n "$LATEST"
          cp "$LATEST" data/reels/publish.mp4

      - name: Verify reel media
        if: steps.select.outputs.draft_id != ''
        run: |
          FP="data/reels/publish.mp4"
          test -s "$FP"
          SIZE=$(stat -c%s "$FP")
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FP")
          echo "QC: size=${SIZE} duration=${DUR}"
          test "$SIZE" -gt 100000
          python - "$DUR" <<'PY'
          import sys
          if float(sys.argv[1]) <= 3:
              raise SystemExit("reel duration must exceed 3 seconds")
          PY

      - name: Publish verified reel
        if: steps.select.outputs.draft_id != '' && inputs.publish_to != 'none'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: "1"
          DRAFT_ID: ${{ steps.select.outputs.draft_id }}
        run: |
          set -o pipefail
          python scripts/publish_reel.py data/reels/publish.mp4 "${{ inputs.publish_to }}" \
            --draft-id "$DRAFT_ID" 2>&1 | tee logs/reels_publish.log

      - name: Persist reel publication state
        if: steps.select.outputs.draft_id != '' && inputs.publish_to != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py push --repo "$GITHUB_REPOSITORY" --root . \
            --producer "reel:${{ github.run_id }}" \
            --lease-file .runtime-state-lease.json

      - name: Release canonical state write lease
        if: always() && inputs.publish_to != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/state_store.py unlock --repo "$GITHUB_REPOSITORY" \
            --lease-file .runtime-state-lease.json

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reels-${{ github.run_id }}
          path: |
            logs/
            data/reels/publish.mp4
          retention-days: 14
          if-no-files-found: warn
