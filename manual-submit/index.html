<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="News Radar Submit">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📤</text></svg>">
  <title>News Radar · 提交來源</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <span class="logo">📤</span>
        <h1>提交來源</h1>
      </div>
      <div class="header-right">
        <span class="status-indicator" id="status-indicator" title="系統狀態">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">檢查中…</span>
        </span>
        <a href="https://hsintiger.github.io/news-radar-dashboard/" target="_blank" class="header-link" title="前往 Dashboard">📡 Dashboard</a>
      </div>
    </header>

    <!-- Main content -->
    <main class="main">
      <!-- Submission Form -->
      <section class="card submit-card">
        <!-- Tab bar -->
        <div class="tabs" id="tab-bar">
          <button class="tab active" data-tab="url" onclick="switchTab('url')">
            <span class="tab-icon">🔗</span>
            <span class="tab-label">網址</span>
          </button>
          <button class="tab" data-tab="text" onclick="switchTab('text')">
            <span class="tab-icon">📝</span>
            <span class="tab-label">純文字</span>
          </button>
          <button class="tab" data-tab="youtube" onclick="switchTab('youtube')">
            <span class="tab-icon">▶️</span>
            <span class="tab-label">YouTube</span>
          </button>
          <button class="tab" data-tab="image" onclick="switchTab('image')">
            <span class="tab-icon">🖼️</span>
            <span class="tab-label">截圖/圖片</span>
          </button>
        </div>

        <!-- Tab content -->
        <div class="tab-content" id="tab-content">
          <!-- URL tab -->
          <div class="tab-pane active" id="pane-url">
            <label class="field-label">文章網址 <span class="hint">（可多行，一行一個）</span></label>
            <textarea id="input-url" class="input-textarea" rows="3" placeholder="https://example.com/article&#10;https://reuters.com/..."></textarea>
          </div>

          <!-- Text tab -->
          <div class="tab-pane" id="pane-text">
            <label class="field-label">文章全文</label>
            <textarea id="input-text" class="input-textarea" rows="8" placeholder="貼上整篇文章內容…"></textarea>
            <div class="char-count" id="text-char-count">0 字</div>
          </div>

          <!-- YouTube tab -->
          <div class="tab-pane" id="pane-youtube">
            <label class="field-label">YouTube 網址</label>
            <input id="input-yt" type="url" class="input-field" placeholder="https://youtube.com/watch?v=...">
            <p class="field-hint">系統會自動抓取字幕，適合理財訪談、科技 podcast 等內容。</p>
            <div class="yt-preview" id="yt-preview" style="display:none">
              <div class="yt-preview-thumb" id="yt-thumb"></div>
              <div class="yt-preview-info">
                <div class="yt-preview-title" id="yt-title"></div>
                <div class="yt-preview-channel" id="yt-channel"></div>
              </div>
            </div>
          </div>

          <!-- Image tab -->
          <div class="tab-pane" id="pane-image">
            <label class="field-label">上傳截圖或圖片</label>
            <div class="upload-zone" id="upload-zone">
              <div class="upload-icon">📸</div>
              <div class="upload-text">點擊選擇圖片或拖曳至此</div>
              <div class="upload-hint">JPG / PNG / HEIC · 最大 20MB</div>
              <img id="img-preview" class="upload-preview" style="display:none">
              <button class="btn-remove" id="btn-remove-img" style="display:none" onclick="clearImage()">✕ 移除</button>
            </div>
            <input id="file-input" type="file" accept="image/jpeg,image/png,image/heic,image/heif" capture="environment" style="display:none">
            <div class="field-group" style="margin-top:12px">
              <input id="input-img-caption" class="input-field" type="text" placeholder="圖片說明（選填）">
            </div>
          </div>
        </div>

        <!-- Options: platforms + schedule + notes -->
        <div class="submit-options">
          <div class="option-group">
            <label class="option-label">發布平台</label>
            <div class="platform-chips">
              <label class="chip selected" data-platform="fb">
                <input type="checkbox" class="platform-cb" value="fb" checked hidden>
                <span>📘 FB</span>
              </label>
              <label class="chip selected" data-platform="ig">
                <input type="checkbox" class="platform-cb" value="ig" checked hidden>
                <span>📸 IG</span>
              </label>
              <label class="chip selected" data-platform="threads">
                <input type="checkbox" class="platform-cb" value="threads" checked hidden>
                <span>🧵 Threads</span>
              </label>
              <label class="chip" id="chip-all" onclick="toggleAllPlatforms()">
                <span>全部</span>
              </label>
            </div>
          </div>

          <div class="option-group">
            <label class="option-label">排程</label>
            <div class="schedule-chips">
              <label class="chip selected" data-schedule="next">
                <input type="radio" name="schedule" value="next" checked hidden>
                <span>⏳ 下一輪 pipeline</span>
              </label>
              <label class="chip" data-schedule="now">
                <input type="radio" name="schedule" value="now" hidden>
                <span>🚀 立即發布</span>
              </label>
            </div>
          </div>

          <div class="field-group">
            <input id="input-note" class="input-field" type="text" placeholder="備註／編輯指示（選填）">
          </div>

          <button class="btn-submit" id="btn-submit" onclick="handleSubmit()">
            <span class="btn-icon">📤</span>
            <span class="btn-text">提交</span>
          </button>
        </div>

        <!-- Status message -->
        <div id="submit-status" class="submit-status" style="display:none"></div>
      </section>

      <!-- Submission History -->
      <section class="card history-card">
        <div class="card-header">
          <h2>📋 提交紀錄</h2>
          <span class="badge" id="history-count">0</span>
          <button class="btn-refresh" onclick="loadHistory()">🔄</button>
        </div>
        <div id="history-list" class="history-list">
          <div class="history-empty">暫無提交紀錄</div>
        </div>
      </section>
    </main>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
