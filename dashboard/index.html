<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Radar · Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.11/dist/sql-wasm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo">📡</span>
        <h1>News Radar</h1>
      </div>
      <div class="sidebar-nav">
        <a class="nav-item active" data-page="home" href="#home">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">首頁</span>
        </a>
        <a class="nav-item" data-page="queue" href="#queue">
          <span class="nav-icon">📋</span>
          <span class="nav-label">發布佇列</span>
          <span class="nav-badge" id="queue-badge">0</span>
        </a>
        <a class="nav-item" data-page="archive" href="#archive">
          <span class="nav-icon">📚</span>
          <span class="nav-label">歷史存檔</span>
        </a>
        <a class="nav-item" data-page="dropped" href="#dropped">
          <span class="nav-icon">🗑️</span>
          <span class="nav-label">被擋掉的</span>
        </a>
        <a class="nav-item" data-page="persona" href="#persona">
          <span class="nav-icon">🎭</span>
          <span class="nav-label">寫作風格</span>
        </a>
        <a class="nav-item" data-page="analytics" href="#analytics">
          <span class="nav-icon">📊</span>
          <span class="nav-label">分析</span>
        </a>
        <a class="nav-item" data-page="source" href="#source">
          <span class="nav-icon">📤</span>
          <span class="nav-label">提交來源</span>
        </a>
        <a class="nav-item" data-page="changelog" href="#changelog">
          <span class="nav-icon">📝</span>
          <span class="nav-label">更新日誌</span>
        </a>
        <a class="nav-item" data-page="settings" href="#settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">設定</span>
        </a>
      </div>
      <div class="sidebar-footer">
        <div class="db-status" id="db-status">
          <span class="status-dot offline"></span>
          <span>資料庫離線</span>
        </div>
        <div class="last-update" id="last-update">—</div>
        <button class="btn-refresh" id="btn-refresh" onclick="refreshDB()">🔄 重新整理</button>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Loading Overlay -->
      <div class="loading-overlay" id="loading-overlay">
        <div class="loader"></div>
        <p>正在載入資料庫…</p>
      </div>

      <!-- Error -->
      <div class="error-banner" id="error-banner" style="display:none">
        <span>⚠️</span>
        <span id="error-text">無法連接到資料庫</span>
        <button onclick="this.parentElement.style.display='none'">✕</button>
      </div>

      <!-- Pages -->
      <div id="page-home" class="page active"></div>
      <div id="page-queue" class="page"></div>
      <div id="page-archive" class="page"></div>
      <div id="page-dropped" class="page"></div>
      <div id="page-persona" class="page"></div>
      <div id="page-analytics" class="page"></div>
      <div id="page-source" class="page"></div>
      <div id="page-changelog" class="page"></div>
      <div id="page-settings" class="page"></div>
    </main>
  </div>

  <div id="toast-container" style="position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none"></div>

  <script src="app.js"></script>
</body>
</html>
