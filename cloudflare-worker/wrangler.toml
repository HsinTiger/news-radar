name = "news-radar-submit"
main = "worker.js"
compatibility_date = "2026-07-23"
workers_dev = true

[vars]
AUTOMATION_MODE = "recovery"
SUBMISSION_PROCESSOR_MODE = "live"
ENABLE_META_PUBLISH_NOW = "true"
ENABLE_SUBSTACK_PUBLISH_NOW = "true"

[observability]
enabled = true
head_sampling_rate = 1.0

[triggers]
# Independent delivery path for the governed GitHub scheduler.  These ticks
# arrive ten minutes after the matching GitHub cron; shared production
# concurrency and daily quotas make the redundant decision run idempotent.
crons = ["27 0,3,10,11,12,13 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hsintiger-social-ops"
database_id = "6c5a3ff6-2608-49eb-b637-416487af1887"
migrations_dir = "migrations"
